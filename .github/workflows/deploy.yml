name: DevSecOps Production Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================
  # JOB 1: TEST, BUILD, AND SECURITY SCANNING
  # ==========================================
  test-and-scan:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest bandit pip-audit

      - name: Unit tests
        run: python -m pytest -v

      - name: Static security analysis
        run: bandit -r app.py -ll

      - name: Dependency audit
        run: pip-audit -r requirements.txt

      - name: Build Docker image
        run: |
          docker build -t devops-review:${{ github.sha }} .

      - name: Generate Trivy report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-review:${{ github.sha }}
          format: json
          output: trivy-results.json
          exit-code: '0'
          severity: HIGH,CRITICAL

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan
          path: trivy-results.json
          if-no-files-found: warn

      - name: Security gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-review:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

  # ==========================================
  # JOB 2: PUBLISH DOCKER IMAGE TO GHCR
  # ==========================================
  publish:
    needs: test-and-scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  # ==========================================
  # JOB 3: DEPLOY TO AWS EC2
  # ==========================================
  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy and verify
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}

        run: |
          ssh "$USER@$HOST" \
            "IMAGE='$IMAGE' bash -s" <<'REMOTE'
          set -euo pipefail

          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')

          docker pull "$IMAGE"

          docker rm -f devops-app || true

          docker run -d \
            --name devops-app \
            --restart unless-stopped \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --memory 512m \
            --cpus 1 \
            -p 5000:5000 \
            "$IMAGE"

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5000/health; then
              exit 0
            fi
            sleep 3
          done

          docker logs devops-app
          exit 1
          REMOTE
